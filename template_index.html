<!DOCTYPE html>
<html>
<head>
  <title>Ethereum Builder + Token Launcher</title>
  <meta charset="utf-8" />
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    .card { padding: 20px; border: 1px solid #ddd; border-radius: 10px; width: 400px; }
    input, button { width: 100%; margin-top: 10px; padding: 10px; }
    #log { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🧱 Ethereum Network & Token Launcher</h1>
  <button onclick="addNetwork()">🦊 Add GBT Network to MetaMask</button>

  <div class="card">
    <h3>🚀 Deploy ERC-20 Token</h3>
    <input id="name" placeholder="Token Name" />
    <input id="symbol" placeholder="Token Symbol" />
    <input id="supply" placeholder="Total Supply (e.g. 1000000)" />
    <button onclick="deployToken()">Deploy</button>
  </div>

  <div id="log"></div>

  <script>
    async function addNetwork() {
      if (typeof window.ethereum === 'undefined') return alert('MetaMask not found');
      try {
        await ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x3E7', // 999 in hex
            chainName: 'GBTNetwork',
            rpcUrls: ['https://gbtnetwork-render.onrender.com'],
            nativeCurrency: { name: 'GoldBarTether', symbol: 'GBT', decimals: 18 },
            blockExplorerUrls: ['https://gbtnetwork-explorer.com']
          }]
        });
        alert("Network added to MetaMask!");
      } catch (e) { alert(e.message); }
    }

    async function deployToken() {
      const data = {
        name: document.getElementById("name").value,
        symbol: document.getElementById("symbol").value,
        supply: document.getElementById("supply").value
      };

      const res = await fetch("/deploy_token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      document.getElementById("log").innerText =
        `✅ ${result.message}\n\n📜 Address: ${result.contract_address}\n🔗 Explorer: ${result.explorer}`;
    }
  </script>
</body>
</html>
